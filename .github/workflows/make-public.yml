name: make-public

on:
  push:
    paths:
      - .github/workflows/make-public.yml
  workflow_dispatch:

permissions:
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set the container package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "--- list ---"
          gh api -H "Accept: application/vnd.github+json" \
            "/users/Shodric/packages?package_type=container" \
            --jq '.[] | {name,visibility,repository:.repository.full_name}'
          echo "--- set ---"
          code=$(gh api --method PUT -H "Accept: application/vnd.github+json" \
            /users/Shodric/packages/container/ltx-flf2v/visibility \
            -f visibility=public --silent -i | awk '/^HTTP/{print $2; exit}')
          echo "PUT visibility -> ${code:-none}"
